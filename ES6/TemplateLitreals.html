<!DOCTYPE html>>
<title>
    hello world
</title>
<script>
    //Template literals (introduced in ES6) are string literals enclosed by backticks (``) 
    //instead of single (') or double (") quotes. They allow for embedded expressions,
    // multi-line strings, and advanced string formatting.

    //1. Core Features & Examples
    //String Interpolation
    //You can embed variables and JavaScript expressions directly inside a string using 
    //the ${expression} syntax.


    const name = 'Alice';
    const age = 25;

    // Traditional ES5 string concatenation
    console.log('Hello, ' + name + '! You are ' + age + ' years old.');

    // ES6 Template Literal
    console.log(`Hello, ${name}! You are ${age} years old.`);

    // Embedding arbitrary expressions or math
    console.log(`In 5 years, 
     you will be ${age + 5}.`);
</script>

<body>
    <h1>Hello</h1>
</body>

</html>
