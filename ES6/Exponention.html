<title>Destrcturing Of Array</title>
<script>

// The exponentiation operator (**) in JavaScript raises the first operand
//  (base) to the power of the second operand (exponent). Introduced in ECMAScript 2016 (ES7),
//  it provides a cleaner, more concise alternative to Math.pow().

// Base ** Exponent
console.log(2 ** 3); // 8  (2 * 2 * 2)
console.log(3 ** 4); // 81 (3 * 3 * 3 * 3)

</script>

<body>
    <h1>Destrcturing Of Array</h1>
