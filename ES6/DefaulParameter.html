<script>

    //Default Parameters in ECMAScript 6 (ES6) allow function parameters to be 
    //initialized with default values if no value or undefined is passed during the function call.

    //1. Syntax & Basic Example
    //Before ES6, manual checks were required inside the function body to set default
    // values. In ES6, default values can be assigned directly in the function signature:

    // Basic Default Parameter Syntax
    function add(a, b = 10, c = 30) {
        return a + b + c;
    }
    console.log(add());
    console.log(add(10)); // Output: 50 (10 + 10 + 30)
    console.log(add(10, 20)); // Output: 60 (10 + 20 + 30)
    console.log(add(10, 20, 40)); // Output: 60 (10 + 20 + 30)


    function main(a = 10, b = add(10, 50)) {
        return a + b;
    }

console.log(main());

</script>

<body>
    <h1>Default parameter</h1>
</body>

</html>
